apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backendjava-db-password
  namespace: storefront-devjavaaa
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: deepagent-aws
    kind: ClusterSecretStore
  target:
    name: app-env
    creationPolicy: Merge
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: teams-dev/storefront-devjavaaa/DB_PASSWORD
