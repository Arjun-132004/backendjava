apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backendjava
  namespace: storefront-devjavaaa
  labels:
    app.kubernetes.io/name: backendjava
    app.kubernetes.io/managed-by: deepagent
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: backendjava
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
